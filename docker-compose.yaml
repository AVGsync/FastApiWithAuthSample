version: "3.0"
services:
  db:
    container_name: "db"
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=restapi_dev
      - POSTGRES_PASSWORD=MoR80830614
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    networks:
      - custom
  auth-app:
    container_name: auth-app
    image: auth-app
    depends_on: 
      - db
    environment:
      REAL_DATABASE_URL: "postgresql+asyncpg://restapi_dev:MoR80830614@db:5432/restapi_dev"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - custom
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - custom

networks:
  custom:
    driver: bridge
